# TEST cluster profile for the pennlinc/slurm-docker-ci container (issue #31).
# Mirrors the defaults babs's own tests use so jobs run inside the CI container
# with no real cluster. NOT a real cluster — paired with the suite's SimBIDS pipelines (mechababs/testing/e2e/pipelines/).
# No cluster_resources here: it lives on the pipeline axis (simbids-*.yaml), so
# this composes the same way a real cluster config does (dev-exercises-prod).
script_preamble: |
  PATH=/opt/conda/envs/babs/bin:$PATH
  # Supply $JOB_TMP so pipeline YAMLs can bind container /tmp to real disk with
  # the same `-B $JOB_TMP:/tmp` line they use on real clusters (see
  # examples/clusters/dartmouth.yaml). Rooted at the container-writable /tmp; the SLURM
  # array vars are set by babs's submit inside the docker-CI container.
  export JOB_TMP="/tmp/sjob-tmp/${SLURM_ARRAY_JOB_ID}_${SLURM_ARRAY_TASK_ID}"
  mkdir -p "${JOB_TMP}"
  trap 'rm -rf "${JOB_TMP}"' EXIT

job_compute_space: "/tmp"

# The image is CentOS 7 (glibc 2.17), so the campaign environment needs the same
# version caps a real old-glibc cluster needs — the newest wheels of these nine
# target a newer glibc, and without the caps uv falls back to source builds gcc 4.8
# cannot compile. Live here rather than commented, so the container rung exercises
# the same code path a real site does (docs/overview.md: dev exercises prod).
#
# numpy is the newest arrival: 2.2.6 is the last release shipping a manylinux2014
# (glibc 2.17) wheel — 2.3.0 moved to manylinux_2_28 — and numpy's own build
# refuses gcc < 9.3 outright, so an uncapped resolution dies in meson rather than
# in the compiler.
env_constraints:
  - numpy<=2.2.6
  - greenlet<=3.2.5
  - h5py<=3.14.0
  - pandas<=2.3.2
  - scipy<=1.15.3
  - scikit-learn<=1.7.2
  - scikit-image<=0.25.2
  - pillow<=12.2.0
  - contourpy<=1.3.2
