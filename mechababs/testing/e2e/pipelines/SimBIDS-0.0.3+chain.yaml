# Downstream half of the chained-inputs e2e (issue #72): a second simbids stage
# that consumes SimBIDS-0.0.3+anchor's output. Copy of SimBIDS-0.0.3+anchor.yaml plus the
# chained input_datasets edge; paired with examples/clusters/test-docker.yaml. NOT real data.

mechababs:
  selection: {}
  # The orchestration edge, mechababs-owned and deliberately separate from babs's
  # `input_datasets` below (docs/spec.md, "`depends_on` is a mechababs-owned
  # declaration"). Declared by the producer's STEM — the natural name to write —
  # and stored resolved to its campaign-relative config path in the statefile.
  # ORDERING ONLY: it carries no kind and wires nothing. This stage names the same
  # producer twice on purpose — here so the cell waits for it, and in
  # `input_datasets` below so babs consumes its output. A QC gate would name it
  # only here.
  depends_on: SimBIDS-0.0.3+anchor
  container:
    # See SimBIDS-0.0.3+anchor.yaml: a plain ReproNim/containers clone, resolved
    # relative to the study root.
    source: ../containers
    name: bids-simbids

analysis_path: "."
input_ria_path: ".babs/input_ria"
output_ria_path: ".babs/output_ria"

bids_app_args:
  --bids-app: "fmriprep"
  $SUBJECT_SELECTION_FLAG: "--participant-label"
  --stop-on-first-crash: ""
  -vv: ""
  --anat-only: ""

singularity_args:
  - --containall
  - --pwd "${PWD}"
  - -B $JOB_TMP:/tmp
  - --userns

cluster_resources:
  interpreting_shell: "/bin/bash"
  hard_runtime_limit: "00:30:00"
  customized_text: |
    #SBATCH --cpus-per-task=1
    #SBATCH --nodes=1
    #SBATCH --ntasks=1

# Chained input: SimBIDS-0.0.3+anchor's output. The key is the producing app
# config's STEM, which is how scaffold recognises it as another cell in this
# campaign and injects that cell's output-RIA URL as origin_url (omitted here — it
# does not exist until the producer has run and merged). This declaration alone
# drives the wiring; `mechababs.depends_on` above drives only the ordering. babs
# fetches + unzips it as job input-prep even though simbids ignores the content.
input_datasets:
  SimBIDS-0.0.3+anchor:
    is_zipped: true
    path_in_babs: sourcedata/SimBIDS-0.0.3+anchor
    required_files:
      - "*SimBIDS-0.0.3+anchor*.zip"

all_results_in_one_zip: true
zip_foldernames:
  SimBIDS-0.0.3+chain: "0-0-3"
